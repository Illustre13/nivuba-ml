version: '3.9'

# Runs the ML service standalone.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  ml:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    ports:
      - '7860:7860'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7860/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
